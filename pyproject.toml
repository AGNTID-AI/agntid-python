[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agntid-sdk"
version = "0.1.0"
description = "AgntID task glue SDK — task metadata and MCP wrapper for agent frameworks (MSK and others)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "AgntID.ai", email = "team@agntid.ai" },
]
keywords = ["agntid", "mcp", "agent", "task-glue", "policy", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://agntid.ai"
Repository = "https://github.com/AGNTID-AI/agntid-python"
Documentation = "https://docs.agntid.ai"

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.14,<3",
]
openai = [
    "openai>=2.20,<3",
    "fastmcp>=2.14,<3",
]
msk = [
    "semantic-kernel>=1.39,<2",
    "fastmcp>=2.14,<3",
]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "build>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agntid*"]

[tool.setuptools.package-data]
agntid = ["py.typed"]
